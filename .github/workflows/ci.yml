name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build API
        run: pnpm --filter @ai-lead-gen/api build

      - name: Build web
        run: pnpm --filter @ai-lead-gen/web build
        env:
          # Public values are inlined at build time; placeholders are enough to compile.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: ai-lead-gen-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: ai-lead-gen-web:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
            NEXT_PUBLIC_API_URL=http://localhost:4000/api
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  integration:
    name: API and e2e suites (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies supabase/migrations)
        run: supabase start

      - name: Export local Supabase credentials
        run: |
          supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          {
            echo "TEST_SUPABASE_URL=${API_URL}"
            echo "TEST_SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "TEST_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
          } >> "$GITHUB_ENV"
          rm supabase.env

      - name: API tests
        run: pnpm test:api

      - name: Install Playwright browser
        run: pnpm --filter @ai-lead-gen/tests exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/.report
            tests/e2e/.results
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
