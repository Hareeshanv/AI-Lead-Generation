# Runs the API and web app in containers against a Supabase project (hosted, or local via `npx supabase start`).
# The database, auth and the lead-webhook edge function are Supabase's; nothing else is needed.
#
#   cp .env.example .env    # fill in SUPABASE_*, NEXT_PUBLIC_*, CAMPAIGN_UNSUBSCRIBE_SECRET, ...
#   docker compose up --build
#
# Intended for a hosted Supabase project. With a local stack, containers cannot reach 127.0.0.1 on the
# host: set SUPABASE_URL=http://host.docker.internal:54321 for the API, and run the web app with
# `pnpm --filter @ai-lead-gen/web dev` (its server-side auth calls use NEXT_PUBLIC_SUPABASE_URL too).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Lets running jobs finish (or requeue) on shutdown; the API exits within 28s.
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
